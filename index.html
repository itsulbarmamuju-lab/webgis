        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

// Fungsi mengubah format "D M S" menjadi Desimal (DD)
function dmsKeDesimal(dmsStr) {
    // Menghapus spasi ganda di awal/akhir dan memecah teks berdasarkan spasi
    var bagian = dmsStr.trim().replace(/\s+/g, ' ').split(' ');
    
    // Jika input kosong, kembalikan nilai bukan angka
    if (bagian.length < 1 || dmsStr.trim() === "") return NaN;

    // Mengambil nilai berdasarkan urutan: [0] Derajat, [1] Menit, [2] Detik
    var d = parseFloat(bagian[0]) || 0;
    var m = parseFloat(bagian[1]) || 0;
    var s = parseFloat(bagian[2]) || 0;

    // Cek apakah angka derajat bernilai minus (Lintang Selatan atau Bujur Barat)
    var nilaiMinus = d < 0 || Object.is(d, -0);
    
    // Rumus konversi DMS ke Desimal (DD) yang akurat
    var desimal = Math.abs(d) + (m / 60) + (s / 3600);
    
    // Kembalikan tanda minus jika koordinat bernilai negatif
    return nilaiMinus ? -desimal : desimal;
}
var markerPencarian = null;

function cariKoordinatDMS() {
    var latInput = document.getElementById('input-lat').value;
    var lngInput = document.getElementById('input-lng').value;

    // Konversi masing-masing input DMS ke bentuk desimal
    var lat = dmsKeDesimal(latInput);
    var lng = dmsKeDesimal(lngInput);

    // Validasi hasil konversi angka
    if (isNaN(lat) || isNaN(lng)) {
        alert("Format salah! Masukkan angka dipisahkan spasi.\nContoh: -6 10 31.4");
        return;
    }

    // Validasi batas koordinat dunia
    if (lat < -90 || lat > 90 || lng < -180 || lng > 180) {
        alert("Koordinat di luar jangkauan peta dunia!");
        return;
    }

    // Hapus marker lama jika ada
    if (markerPencarian !== null) {
        map.removeLayer(markerPencarian);
    }

    // Gerakkan peta ke titik lokasi baru
    map.setView([lat, lng], 15);

    // Tambah marker baru beserta informasi koordinat desimalnya
    markerPencarian = L.marker([lat, lng]).addTo(map);
    markerPencarian.bindPopup("<b>Lokasi Ditemukan!</b><br>Lat (DD): " + lat.toFixed(5) + "<br>Lng (DD): " + lng.toFixed(5)).openPopup();
}
